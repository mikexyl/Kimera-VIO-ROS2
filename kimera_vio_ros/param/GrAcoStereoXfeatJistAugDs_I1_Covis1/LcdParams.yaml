%YAML:1.0
# GrAco stereo JIST profile used by the April 6, 2026 jist-aug-ds run.
# The TensorRT engine path is supplied explicitly by the launch file.
use_nss: 1
alpha: 1
min_temporal_matches: 1
recent_frames_window: 100
max_db_results: 50
min_nss_factor: 0.05
min_matches_per_island: 1
max_intraisland_gap: 5
max_nrFrames_between_islands: 3
max_nrFrames_between_queries: 2

refine_pose: 0

lowe_ratio: 0.7
matcher_type: 3

nfeatures: 1000
scale_factor: 1.2
nlevels: 8
edge_threshold: 31
first_level: 0
WTA_K: 2
score_type_id: 0
patch_sze: 31
fast_threshold: 20

betweenRotationPrecision: 1
betweenTranslationPrecision: 1

odom_rot_threshold: 0.1
odom_trans_threshold: 1
pcm_rot_threshold: 0.1
pcm_trans_threshold: 1
gnc_alpha: 0.7

max_lc_cached_before_optimize: 10

disparity_threshold: 0.5

min_nr_2d2d_inliers: 10
min_nr_3d3d_inliers: 5
min_nr_2d3d_inliers: 20

ransac_threshold_2d2d: 1e-06
ransac_threshold_3d3d: 0.3
ransac_threshold_2d3d: 1.0
ransac_use_1point_3d3d: 1
ransac_use_2point_2d2d: 0
pose_recovery_type: 1
ransac_max_iterations: 500
ransac_probability: 0.995
ransac_randomize: 0

optimize_2d2d_pose_from_inliers: 0
optimize_3d3d_pose_from_inliers: 0
optimize_2d3d_pose_from_inliers: 1

ransac_2d2d_algorithm: 0
ransac_2d3d_algorithm: 3

lcd_lg_num_features: 500
lcd_lg_model_path: ""
lcd_faiss_index_path: ""
xfeat_nv_head_model_path: ""
netvlad_model_path: ""

local_window_size: 0

min_pnp_num_landmarks: 30
min_lmk_obs_ratio: 0.1
min_lmk_obs_count: 3
min_lmk_parallax: 50
lcd_min_matched_features: 30
max_lmk_reproj_error: 3

vpr_model_type: jist
vpr_model_path: ""
vpr_seq_interval: 1
vpr_max_sequence_distance_m: 10
vpr_short_sequence_policy: wait

max_covisibility_score: 1.0
min_sim_score: 0.85

publish_only_sequence: false
use_covis_projection: 1
